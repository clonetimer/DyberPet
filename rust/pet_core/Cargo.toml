[package]
name = "dyberpet-native-core"
version = "0.1.0"
edition = "2021"
publish = false
description = "Opt-in native resource inspection and hashing core for DyberPet"

[lib]
name = "dyberpet_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "=0.22.6", features = ["extension-module", "abi3-py39"] }
sha2 = "=0.10.8"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
