name: Doro standalone Live2D engine and private-art safety

on:
  pull_request:
    paths:
      - "tools/doro_live2d_local.py"
      - "tools/doro_personal_setup.py"
      - "tests/test_doro_personal_setup.py"
      - "tools/doro_live2d_interaction.py"
      - "run_DyberPet.py"
      - "DyberPet/DyberSettings/doro_live2d_dialog.py"
      - "DyberPet/DyberSettings/CharCardUI.py"
      - "tests/test_doro_live2d_local.py"
      - "requirements-windows-portable.txt"
      - "tools/build_windows_portable.ps1"
      - ".github/workflows/doro-live2d-qt.yml"
  push:
    paths:
      - "tools/doro_live2d_local.py"
      - "tools/doro_personal_setup.py"
      - "tests/test_doro_personal_setup.py"
      - "tools/doro_live2d_interaction.py"
      - "run_DyberPet.py"
      - "DyberPet/DyberSettings/doro_live2d_dialog.py"
      - "DyberPet/DyberSettings/CharCardUI.py"
      - "tests/test_doro_live2d_local.py"
      - ".github/workflows/doro-live2d-qt.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-model-only:
    name: Windows native Live2D wheel, no source art
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install real native Live2D engine and minimal Qt
        run: python -m pip install "numpy==1.26.4" "PySide6==6.5.2" "live2d-py==1.0.0" "PyOpenGL==3.1.10"
      - name: Verify the actual native Qt/OpenGL Live2D imports
        run: python -c "import live2d,OpenGL.GL; from PySide6.QtOpenGLWidgets import QOpenGLWidget; from DyberPet.DyberSettings.doro_live2d_dialog import DoroLive2DPreviewDialog; print('DORO_LIVE2D_NATIVE_QT_IMPORTED=true')"
      - name: Compile and run model safety/inventory regressions
        run: |
          python -m py_compile tools/doro_live2d_local.py DyberPet/DyberSettings/doro_live2d_dialog.py
          python -m unittest discover -s tests -p "test_doro_live2d_local.py" -v
          python -m unittest discover -s tests -p "test_doro_personal_setup.py" -v
      - name: Verify the PR does not require/store artist model
        shell: pwsh
        run: |
          if (Test-Path "res/role/Doro/Doro.moc3") { throw "Never bundle unlicensed Doro models" }
          Write-Host "NO_DORORONG_CREATOR_ART_COPIED=True"
