name: Blender chibi render smoke

on:
  pull_request:
    paths:
      - "tools/blender_chibi_scene.py"
      - "tools/chibi_clip_map.py"
      - "tools/render_chibi_blender.py"
      - "tools/character_pipeline.py"
      - "tools/import_chibi_animations.py"
      - "tests/test_real_blender_smoke.py"
      - "tools/blender_demo_export.py"
      - ".github/workflows/blender-chibi-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-original-geometry:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Blender and Pillow
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender libegl1 libgl1-mesa-dri python3-numpy
          python -m pip install "Pillow>=10,<13"
      - name: Verify Blender executable
        run: blender -b --factory-startup --python-expr "import bpy, numpy; print(bpy.app.version_string, numpy.__version__)"
      - name: Render original geometry and import as DyberPet character
        env:
          BLENDER_BIN: blender
          LIBGL_ALWAYS_SOFTWARE: "1"
          BLENDER_CI_ARTIFACT_DIR: blender-demo-preview
        run: python -m unittest discover -s tests -p "test_real_blender_smoke.py" -v
      - name: Upload original synthetic role preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-chibi-render-preview
          path: blender-demo-preview/
          if-no-files-found: ignore
          retention-days: 14
