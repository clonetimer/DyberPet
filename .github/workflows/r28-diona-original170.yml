name: R28 Diona 170 real original PNG frames
on:
  push:
    branches: [feat/r28-remaining-55-real-source-discovery-20261028]
    paths:
      - "tools/gmcy_diona_170_source.json"
      - "tools/install_gmcy_diona.py"
      - "tests/test_r28_diona_170.py"
      - ".github/workflows/r28-diona-original170.yml"
  pull_request:
    paths:
      - "tools/gmcy_diona_170_source.json"
      - "tools/install_gmcy_diona.py"
      - "tests/test_r28_diona_170.py"
permissions:
  contents: read
jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install Pillow==12.0.0
      - name: Check 170 frame hashes, source substitution, no-overwrite and group semantics
        run: python -m unittest discover -s tests -p "test_r28_diona_170.py" -v
  original:
    runs-on: ubuntu-latest
    needs: offline
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install Pillow==12.0.0
      - name: Download 170 authentic PNGs and install native DyberPet Diona role
        run: |
          python - <<'PY'
          from pathlib import Path
          from tempfile import TemporaryDirectory
          import json
          from tools.install_gmcy_diona import (
              SOURCE_KEY, download_original_archive, verify_original_frames, install_gmcy_diona)
          from tools.install_native_role import validate_native_role
          from tools.artist_animation_audit import audit_native_character
          from tools.genshin_library import scan_genshin_library
          raw = download_original_archive()
          originals = verify_original_frames(raw)
          assert len(originals)==170
          with TemporaryDirectory(prefix="r28-creator-diona-") as tmp:
              root=Path(tmp)/"roles"
              installed=install_gmcy_diona(SOURCE_KEY,root,confirmed=True,archive_bytes=raw)
              valid=validate_native_role(installed)
              receipt=json.loads((installed/"PERSONAL_IMPORT.json").read_text("utf-8"))
              quality=audit_native_character(installed)
              report=scan_genshin_library(root)
              assert receipt["selected_profile"]=="genshin_diona"
              assert receipt["sha1_blob_sha_verified_for_every_frame"]
              assert valid["actions"]==9 and valid["images"]==170
              assert report["summary"]["personal_art_profile_count"]==1
              print("R28_REAL_DIONA170_NATIVE_VERIFIED="+json.dumps({
                "original_archive_bytes":len(raw),"original_pngs":len(originals),
                "native_actions":valid["actions"],"native_images":valid["images"],
                "original_frame_hashes_passed":True,
                "author_group_semantics_pending":True,
                "likeness_manually_approved":False,
                "windows_desktop_QA_approved":False,
                "art_uploaded_to_GitHub":False,
                "pixel_quality_summary":quality["summary"]
              },ensure_ascii=False),flush=True)
          PY
      - name: Never upload third-party sprites or personal data
        run: |
          test ! -e res/role/SourceGmcyDiona
          echo "ART_UPLOAD=false"
