name: Guga Doro pinned upstream source acceptance

on:
  workflow_dispatch:
  push:
    branches:
      - feat/guga-doro-builtin-demos-20261024
    paths:
      - tools/install_creator_mascots.py
      - tools/import_codex_pet.py
      - tools/verify_creator_mascots.py
      - tools/role_action_preview.py
      - tools/mascot_library.py
      - DyberPet/DyberSettings/CharCardUI.py
      - tools/role_family.py
      - tools/personal_mascot_batch.py
      - tests/test_role_family_ownership.py
      - tests/test_creator_mascot_fetch.py
      - tests/test_personal_mascot_batch.py
      - .github/workflows/mascot-source-integrity.yml
  pull_request:
    paths:
      - tools/install_creator_mascots.py
      - tools/import_codex_pet.py
      - tools/verify_creator_mascots.py
      - tools/role_action_preview.py
      - tools/mascot_library.py
      - DyberPet/DyberSettings/CharCardUI.py
      - tools/role_family.py
      - tools/personal_mascot_batch.py
      - tests/test_role_family_ownership.py
      - tests/test_creator_mascot_fetch.py
      - tests/test_personal_mascot_batch.py
      - .github/workflows/mascot-source-integrity.yml

permissions:
  contents: read

jobs:
  pinned-creator-source:
    name: exact-guga-doro-real-creator-sprites
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install only sprite converter dependency
        run: python -m pip install Pillow==12.0.0
      - name: Verify classic Guga/Doro plus separately authored Doro V2 exact source hashes and native actions
        run: |
          PYTHONPATH=. python tools/verify_creator_mascots.py
      - name: Test pinned alternate identity, offline consent and source-batch no-false-success
        run: |
          python -m unittest discover -s tests -p 'test_creator_mascot_fetch.py' -v
          python -m unittest discover -s tests -p 'test_personal_mascot_batch.py' -v
          python -m unittest discover -s tests -p 'test_role_family_ownership.py' -v
      - name: Ensure no third party sprites were committed as artifacts
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"
