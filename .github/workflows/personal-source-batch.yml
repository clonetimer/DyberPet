name: Personal local artist batch (offline)
on:
  pull_request:
    paths:
      - "tools/personal_source_batch.py"
      - "DyberPet/DyberSettings/CharCardUI.py"
      - "tests/test_creator_batch_gui_contract.py"
      - "tools/personal_install_journal.py"
      - "tests/test_personal_install_journal.py"
      - "tests/test_personal_install_recovery.py"
      - "tests/test_personal_source_batch.py"
      - "docs/personal_source_batch.md"
      - ".github/workflows/personal-source-batch.yml"
  push:
    branches:
      - "feat/personal-local-artist-batch-20261026"
    paths:
      - "tools/personal_source_batch.py"
      - "DyberPet/DyberSettings/CharCardUI.py"
      - "tests/test_creator_batch_gui_contract.py"
      - "tools/personal_install_journal.py"
      - "tests/test_personal_install_journal.py"
      - "tests/test_personal_install_recovery.py"
      - "tests/test_personal_source_batch.py"
      - "docs/personal_source_batch.md"
      - ".github/workflows/personal-source-batch.yml"

permissions:
  contents: read

jobs:
  offline-plan:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install only offline image parser
        run: python -m pip install Pillow==12.0.0
      - name: Validate atomic local crash-survivable per-character progress
        run: python -m unittest discover -s tests -p "test_personal_install_journal.py" -v
      - name: Recover interrupted or failed original artist source runs without dupes
        run: python -m unittest discover -s tests -p "test_personal_install_recovery.py" -v
      - name: Validate GUI batch opt-in, stop and source-bounded receipts
        run: python -m unittest discover -s tests -p "test_creator_batch_gui_contract.py" -v
      - name: Test consent, source selection, and no-artwork guarantees
        run: python -m unittest discover -s tests -p "test_personal_source_batch.py" -v
      - name: Test real 123-profile source planning without download or install
        run: |
          python -c "from pathlib import Path; from tempfile import TemporaryDirectory; from tools.personal_source_batch import plan_personal_sources; t=TemporaryDirectory(); root=Path(t.name)/'not_created'; r=plan_personal_sources(root); s=r['summary']; assert s['selected_profiles']==123,s; assert s['ready_for_opt_in']+s['manual_import_only']+s['missing_source']==123,s; assert not root.exists(); print(s)"
