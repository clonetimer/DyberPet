name: Rust Core Isolated

on:
  push:
    branches:
      - "refactor/rust-core-isolated-20261023"
    paths:
      - "rust/pet_core/**"
      - "DyberPet/assistant/native_bridge.py"
      - "DyberPet/assistant/character_fidelity.py"
      - "DyberPet/assistant/character_audio.py"
      - "DyberPet/assistant/guga_audio.py"
      - "tests/test_rust_bridge.py"
      - ".github/workflows/rust-core-isolated.yml"
  pull_request:
    paths:
      - "rust/pet_core/**"
      - "DyberPet/assistant/native_bridge.py"
      - "DyberPet/assistant/character_fidelity.py"
      - "DyberPet/assistant/character_audio.py"
      - "DyberPet/assistant/guga_audio.py"
      - "tests/test_rust_bridge.py"
      - ".github/workflows/rust-core-isolated.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-python-parity:
    name: native (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/pet_core -> target
      - name: Run standalone Rust unit tests
        run: cargo test --manifest-path rust/pet_core/Cargo.toml
      - name: Install maturin and build stable ABI wheel
        run: |
          python -m pip install "maturin>=1.7,<2"
          maturin build --release --manifest-path rust/pet_core/Cargo.toml --interpreter python --out wheelhouse
          python -m pip install --no-index --find-links wheelhouse dyberpet-native-core
      - name: Confirm native module and Rust/Python equivalence
        env:
          DYBERPET_REQUIRE_RUST: "1"
        run: python -m unittest discover -s tests -p "test_rust_bridge.py" -v
      - name: Entire assistant test suite on unchanged Python path
        env:
          DYBERPET_NATIVE_BACKEND: python
        run: python -m unittest discover -s tests -p "test_assistant_*.py" -v
      - name: Entire assistant test suite with Rust backend enabled
        env:
          DYBERPET_NATIVE_BACKEND: rust
          DYBERPET_REQUIRE_RUST: "1"
        run: python -m unittest discover -s tests -p "test_assistant_*.py" -v
