name: R32 Codex original JSON/WebP alternate GitHub host acceptance
on:
  pull_request:
    paths:
      - "tools/install_artist_codex.py"
      - "tools/pinned_github_png_transport.py"
      - "tests/test_r32_codex_asset_fallback.py"
      - ".github/workflows/r32-codex-host-fallback.yml"
  push:
    branches: [fix/r32-merge-win-local-retry-r31-verified-sources-20261028]
    paths:
      - "tools/install_artist_codex.py"
      - "tools/pinned_github_png_transport.py"
      - "tests/test_r32_codex_asset_fallback.py"
      - ".github/workflows/r32-codex-host-fallback.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.11"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install Pillow==12.0.0
      - name: Mirrors reject fake byte and incorrect original commit for Codex webp/json
        run: python -m unittest discover -s tests -p "test_r32_codex_asset_fallback.py" -v
      - name: Existing creator installation regression with fixtures
        run: python -m unittest discover -s tests -p "test_artist_codex_install.py" -v
  real-win:
    name: Windows actual creator Codex bytes with raw-GitHub intentionally blocked
    needs: unit
    runs-on: windows-latest
    timeout-minutes: 17
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install Pillow==12.0.0
      - name: Verify real 4 original Codex sprite atlases via blocked raw host
        shell: pwsh
        run: |
          @'
          import json
          from urllib.error import URLError
          from urllib.request import urlopen
          from tools.install_artist_codex import ROOT, SOURCES, _download_pinned
          from tools.pinned_github_png_transport import reset_transport_preference_for_tests
          reset_transport_preference_for_tests()
          for key in ("ayaka", "citlali", "hu_tao", "yae_miko"):
              pet_id, label, profile, meta, sheet = SOURCES[key]
              fetched=[]
              def blocked_raw(req, timeout=30):
                  address=req.full_url
                  if address.startswith("https://raw.githubusercontent.com/"):
                      raise URLError("Simulated Windows regional raw.githubusercontent.com block")
                  fetched.append(address)
                  return urlopen(req,timeout=timeout)
              base=ROOT+"/"+pet_id
              for name,identity in (("pet.json",meta),("spritesheet.webp",sheet)):
                  data=_download_pinned(base+"/"+name,identity,opener=blocked_raw)
                  if name=="pet.json":
                      manifest=json.loads(data)
                      assert manifest["id"]==pet_id
                      assert manifest["spritesheetPath"]=="spritesheet.webp"
              assert len(fetched)>=2
              assert all("raw.githubusercontent.com" not in u for u in fetched)
              print("R32_REAL_WINDOWS_CODEX_MIRROR_PASS="+json.dumps({
                  "profile":profile, "upstream_commit":"db2f6306ce78f6559ab27155d7bfaf00bf43809d",
                  "asset_count":2,"both_original_Git_blob_SHA1_and_lengths_verified":True,
                  "raw_GitHub_block_simulated":True,"original_art_uploaded":False,
                  "local_visual_qa_passed":False
              },ensure_ascii=False),flush=True)
          '@ | Set-Content -Encoding UTF8 "$env:RUNNER_TEMP/r32_real_codex.py"
          python "$env:RUNNER_TEMP/r32_real_codex.py"
          if ($LASTEXITCODE -ne 0) { throw "Real pinned original Codex source download rejected" }
      - name: Source files are never sent to Actions artifacts
        run: echo "R32_NO_CREATOR_ART_PUBLISHED=true"
