name: Doro single-role completion gate

on:
  pull_request:
    paths:
      - "tools/doro_single_role_gate.py"
      - "tests/test_doro_single_role_gate.py"
      - "docs/doro_only_finish_r51.md"
      - ".github/workflows/doro-single-role.yml"
  push:
    paths:
      - "tools/doro_single_role_gate.py"
      - "tests/test_doro_single_role_gate.py"
      - ".github/workflows/doro-single-role.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  doro-only-regression:
    name: Never mark an unfinished Doro source as finished
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install offline PNG evidence parser
        run: python -m pip install "Pillow>=10,<13"
      - name: Compile actual single-role reviewer
        run: python -m py_compile tools/doro_single_role_gate.py tests/test_doro_single_role_gate.py
      - name: Run Doro-only regressions without third-party art
        run: python -m unittest discover -s tests -p "test_doro_single_role_gate.py" -v
      - name: Assert missing original art never passes an honest finished-role gate
        shell: bash
        run: |
          set -euo pipefail
          if python tools/doro_single_role_gate.py --role res/role/DoroNotInstalled --require-complete; then
            echo "ERROR: missing Doro source must not be marked finished"
            exit 1
          fi
          echo "DORO_NOT_YET_FINISHED_CORRECTLY_BLOCKED=true"
