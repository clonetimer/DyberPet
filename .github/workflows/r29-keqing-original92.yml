name: R29 Keqing original 92 frames exact-source native integration
on:
  push:
    branches: [feat/r29-keqing-92-original-motion-20261028]
    paths:
      - "tools/gmcy_keqing_92_source.json"
      - "tools/install_gmcy_keqing.py"
      - "tests/test_r29_keqing_92.py"
      - ".github/workflows/r29-keqing-original92.yml"
  pull_request:
    paths:
      - "tools/gmcy_keqing_92_source.json"
      - "tools/install_gmcy_keqing.py"
      - "tests/test_r29_keqing_92.py"
permissions:
  contents: read
jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install Pillow==12.0.0
      - name: Verify exact author provenance and no-untrusted-code import
        run: python -m unittest discover -s tests -p "test_r29_keqing_92.py" -v
  original:
    runs-on: ubuntu-latest
    needs: offline
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install Pillow==12.0.0
      - name: Get complete original Keqing asset; verify every Git blob and all 92 native frames
        run: |
          python - <<'PY'
          from pathlib import Path
          from tempfile import TemporaryDirectory
          import json
          from tools.install_gmcy_keqing import SOURCE_KEY, download_original_archive, verify_original_frames,install_gmcy_keqing
          from tools.install_native_role import validate_native_role
          from tools.artist_animation_audit import audit_native_character
          from tools.genshin_library import scan_genshin_library
          raw=download_original_archive()
          original=verify_original_frames(raw)
          assert len(original)==92
          with TemporaryDirectory() as temp:
              root=Path(temp)/"roles"
              role=install_gmcy_keqing(SOURCE_KEY,root,archive_bytes=raw,confirmed=True)
              report=validate_native_role(role)
              qa=audit_native_character(role)
              receipt=json.loads((role/"PERSONAL_IMPORT.json").read_text(encoding="utf-8"))
              assert report["actions"]==6 and report["images"]==92
              assert receipt["selected_profile"]=="genshin_keqing" and receipt["sha1_blob_sha_verified_for_every_frame"]
              assert scan_genshin_library(root)["summary"]["personal_art_profile_count"]==1
              print("R29_REAL_KEQING92_NATIVE_VERIFIED="+json.dumps({
               "original_archive_bytes":len(raw),"original_pngs":len(original),
               "native_actions":report["actions"],"native_frames":report["images"],
               "original_frame_git_blob_sha1_verified":True,
               "pixel_quality":qa["summary"],"author_likeness_approved":False,
               "action_semantics_approved":False,"private_art_republished":False
              },ensure_ascii=False),flush=True)
          PY
      - name: No original art uploaded as CI artifact
        run: test ! -e res/role/SourceGmcyKeqing
