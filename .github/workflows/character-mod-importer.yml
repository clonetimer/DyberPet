permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install image dependency
        run: python -m pip install "Pillow>=10,<13"
      - name: Compile modified Python modules
        run: python -m py_compile tools/chibi_clip_map.py tools/render_chibi_blender.py tools/audit_character_sources.py tools/character_pipeline.py tools/install_native_role.py DyberPet/conf.py tools/import_codex_pet.py tools/import_chibi_animations.py tools/chibi_layout.py tools/chibi_profiles.py tools/genshin_library.py tools/genshin_roster.py tools/genshin_complete_roster.py tools/genshin_batch.py tools/create_original_mascot.py tools/generate_builtin_chibi_demos.py tools/generate_mascot_demos.py tools/mascot_library.py tools/role_family.py tests/test_role_family_ownership.py tools/personal_role_import.py tools/chibi_preview.py DyberPet/DyberSettings/CharCardUI.py DyberPet/DyberSettings/mascot_preview_dialog.py tools/role_action_preview.py tests/test_mascot_live_preview.py tests/test_qt_character_loader.py
      - name: Check standalone Windows-friendly CLI
        run: python tools/import_codex_pet.py --help
      - name: Check GIF/PNG importer CLI
        run: python tools/import_chibi_animations.py --help
      - name: Check native ZIP importer CLI
        run: python tools/install_native_role.py --help
      - name: Check rights-gated character pipeline CLI
        run: python tools/character_pipeline.py --help
      - name: Check Genshin local ZIP/folder probe and status CLI
        run: |
          python tools/genshin_batch.py --help
          python tools/genshin_batch.py status --roles xiao,wanderer
      - name: List and preview new Genshin characters without assets or rights claims
        run: |
          python tools/genshin_batch.py list
          python tools/genshin_batch.py preview --roles xiao,hu_tao
      - name: Check offline personal-only importer CLI
        run: |
          python tools/personal_role_import.py --help
          python tools/genshin_batch.py personal-install --help
      - name: Check original playable chibi CLI
        run: python tools/create_original_mascot.py --help
      - name: Validate source registry structure
        run: python tools/character_pipeline.py sources
      - name: Audit source registry offline
        run: python tools/audit_character_sources.py
      - name: Check Blender runner CLI
        run: python tools/render_chibi_blender.py --help
      - name: Run importer unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

  qt-loader-smoke:
    # Calls the actual DyberPet runtime PetConfig/Act/QPixmap loader, not
    # only the independent artwork conversion functions.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install native GUI dependency
        run: python -m pip install "Pillow>=10,<13" "PySide6==6.5.2"
      - name: Exercise real QPixmap and PetConfig role loader
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -p "test_qt_character_loader.py" -v

  package-original-role:
    name: downloadable-original-role
    needs: [test, qt-loader-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install first-party drawing dependency
        run: python -m pip install "Pillow>=10,<13"
      - name: Generate original animated role and verify installed ZIP
        shell: bash
        run: |
          python tools/create_original_mascot.py --output-root out_original
          python - <<'PY'
          from pathlib import Path
          import tempfile
          import zipfile
          from tools.install_native_role import install_native_role, validate_native_role
          role = Path("out_original/StarSprout")
          archive = Path("StarSprout-Original-Role.zip")
          with zipfile.ZipFile(archive, "w", compression=zipfile.ZIP_DEFLATED) as out:
              for item in sorted(role.rglob("*")):
                  if item.is_file():
                      out.write(item, str(Path("StarSprout") / item.relative_to(role)))
          with tempfile.TemporaryDirectory() as tmp:
              reinstalled = install_native_role(archive, Path(tmp) / "installed")
              report = validate_native_role(reinstalled)
              assert report["images"] == 46, report
              assert report["actions"] == 7, report
              assert (reinstalled / "ANIMATION_PREVIEW.png").is_file()
              print("ORIGINAL_ROLE_ZIP_SMOKE_OK", report)
          PY
          sha256sum StarSprout-Original-Role.zip
      - name: Publish original role for zero-code local import
        uses: actions/upload-artifact@v4
        with:
          name: StarSprout-Original-Role
          path: StarSprout-Original-Role.zip
          if-no-files-found: error
          retention-days: 14
