permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install image dependency
        run: python -m pip install "Pillow>=10,<13"
      - name: Compile modified Python modules
        run: python -m py_compile tools/creator_art_preference.py tools/character_source_coverage.py tests/test_creator_art_preferences.py tools/chibi_clip_map.py tools/render_chibi_blender.py tools/audit_character_sources.py tools/character_pipeline.py tools/install_native_role.py DyberPet/conf.py tools/import_codex_pet.py tools/import_chibi_animations.py tools/chibi_layout.py tools/chibi_profiles.py tools/genshin_library.py tools/genshin_roster.py tools/genshin_complete_roster.py tools/genshin_batch.py tools/create_original_mascot.py tools/generate_builtin_chibi_demos.py tools/generate_mascot_demos.py tools/mascot_library.py tools/role_family.py tests/test_role_family_ownership.py tools/personal_role_import.py tools/chibi_preview.py DyberPet/DyberSettings/CharCardUI.py DyberPet/DyberSettings/mascot_preview_dialog.py tools/role_action_preview.py tools/character_catalog_search.py DyberPet/DyberSettings/character_catalog_dialog.py tests/test_character_catalog_search.py tests/test_mascot_live_preview.py tests/test_qt_character_loader.py
      - name: Check standalone Windows-friendly CLI
        run: python tools/import_codex_pet.py --help
      - name: Check GIF/PNG importer CLI
        run: python tools/import_chibi_animations.py --help
      - name: Check native ZIP importer CLI
        run: python tools/install_native_role.py --help
      - name: Check rights-gated character pipeline CLI
        run: python tools/character_pipeline.py --help
      - name: Check Genshin local ZIP/folder probe and status CLI
        run: |
          python tools/genshin_batch.py --help
          python tools/genshin_batch.py status --roles xiao,wanderer
      - name: List and preview new Genshin characters without assets or rights claims
        run: |
          python tools/genshin_batch.py list
          python tools/genshin_batch.py preview --roles xiao,hu_tao
      - name: Check offline personal-only importer CLI
        run: |
          python tools/personal_role_import.py --help
          python tools/genshin_batch.py personal-install --help
      - name: Check original playable chibi CLI
        run: python tools/create_original_mascot.py --help
      - name: Validate source registry structure
        run: python tools/character_pipeline.py sources
      - name: Audit source registry offline
        run: python tools/audit_character_sources.py
      - name: Check Blender runner CLI
        run: python tools/render_chibi_blender.py --help
      - name: Check lightweight creator spritesheet source CLI
        run: python tools/install_artist_codex.py --help
      - name: Review pinned Shimeji source definitions
        run: |
          python tools/install_artist_shimeji.py --help
          python tools/install_nanopet_shimeji.py --help
          python tools/install_external_codex.py --help
          python -m unittest discover -s tests -p "test_external_codex_sources.py" -v
          python tools/character_source_coverage.py --missing-only > missing-creator-sources.json
          python -m unittest discover -s tests -p "test_nanopet_shimeji_sources.py" -v
          python -m unittest discover -s tests -p "test_personal_shimeji_zip.py" -v
          python -m unittest discover -s tests -p "test_shimejishop_itto.py" -v
          python -m unittest discover -s tests -p "test_shimejishop_kaveh.py" -v
          python -m unittest discover -s tests -p "test_pinned_kaveh_shimeji.py" -v
          python -m unittest discover -s tests -p "test_artist_animation_audit.py" -v
          python -m unittest discover -s tests -p "test_pinned_codexpetdb.py" -v
          python -m unittest discover -s tests -p "test_pending_source_probes.py" -v
          python -m unittest discover -s tests -p "test_new_codexpetdb_discovery.py" -v
          python -m unittest discover -s tests -p "test_pinned_gui_dispatch.py" -v
          python -m unittest discover -s tests -p "test_personal_codex_zip.py" -v
          python -m unittest discover -s tests -p "test_community_codex_leads.py" -v
          python -m unittest discover -s tests -p "test_react_shimeji_leads.py" -v
          python -m unittest discover -s tests -p "test_pinned_react_shimeji.py" -v
          python -m unittest discover -s tests -p "test_missing_react_lfs_probe.py" -v
          python -m unittest discover -s tests -p "test_artist_shimeji_sources.py" -v
          python -m unittest discover -s tests -p "test_creator_art_preferences.py" -v
      - name: Test Git-pinned 6-role Codex source registry
        run: python -m unittest discover -s tests -p "test_artist_codex_install.py" -v
      - name: Check artist-source personal installer CLI
        run: python tools/install_artist_genshin.py --help
      - name: Verify pinned artist source ZIP installer without network
        run: python -m unittest discover -s tests -p "test_artist_genshin_install.py" -v
      - name: Run importer unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

  verify-real-artist-download:
    name: Verify all reviewed Codex artist sources (no redistribution)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install original sprite atlas conversion dependency
        run: python -m pip install "Pillow>=10,<13"
      - name: Download every reviewed pinned author atlas and test native actions
        shell: bash
        run: |
          for role in $(python -c 'from tools.install_artist_codex import SOURCES; print(" ".join(SOURCES))'); do
            python tools/install_artist_codex.py "$role" --role-root "$RUNNER_TEMP/original-art-qa" --accept-personal-use
          done
          python - <<'PY'
          import json,os
          from pathlib import Path
          from tools.install_native_role import validate_native_role
          from tools.install_artist_codex import SOURCES
          root=Path(os.environ["RUNNER_TEMP"])/"original-art-qa"
          for key,source in SOURCES.items():
              folder="SourceCodex"+"".join(piece.title() for piece in key.split("_"))
              target=root/folder
              report=validate_native_role(target)
              assert report["images"]>=6 and report["actions"]>=2,(key,report)
              receipt=json.loads((target/"PERSONAL_IMPORT.json").read_text("utf-8"))
              assert receipt["selected_profile"]==source[2]
              assert receipt["likeness_manually_reviewed"] is False
              geometry=json.loads((target/"IMPORT_REPORT.json").read_text("utf-8"))
              assert geometry["style"]=="classic",(key,geometry["style"])
              assert geometry["preserve_source_frames"] is True,key
              assert geometry["source_pixel_integrity_verified"] is True,key
              assert geometry["aligned_frames_per_action"]=={},key
              print("REAL_ART_PIXELS_VALIDATED",key,report)
          PY
      - name: Download genuine Shimeji frames and exercise native actions
        shell: bash
        run: |
          for role in albedo venti; do
            python tools/install_artist_shimeji.py "$role" --role-root "$RUNNER_TEMP/shimeji-source-qa" --accept-personal-use
          done
          python - <<'PY'
          import json,os
          from pathlib import Path
          from tools.install_native_role import validate_native_role
          from PIL import Image
          root=Path(os.environ["RUNNER_TEMP"])/"shimeji-source-qa"
          for kind in ("albedo", "venti"):
              role=root/("SourceShimeji"+kind.title())
              report=validate_native_role(role)
              assert report["images"]>=10 and report["actions"]>=5,(kind,report)
              receipt=json.loads((role/"PERSONAL_IMPORT.json").read_text("utf-8"))
              assert receipt["source_kind"]=="creator_shimeji_frames"
              assert receipt["likeness_manually_reviewed"] is False
              for name in ("stand_0.png","drag_0.png","fall_0.png","walk_0.png"):
                  with Image.open(role/"action"/name) as img:
                      img.verify()
              print("REAL_SHIMEJI_FRAMES_VALIDATED",kind,report)
          PY
      - name: Download 2 new Genshin identities from NanoPet author-credited Shimeji
        shell: bash
        run: |
          for role in aether-by-tenkotenmeo zhongli-by-vol-tuna; do
            python tools/install_nanopet_shimeji.py "$role" --role-root "$RUNNER_TEMP/nanopet-author-qa" --accept-personal-use
          done
          python - <<'PY'
          import json,os
          from pathlib import Path
          from PIL import Image
          from tools.install_native_role import validate_native_role
          root=Path(os.environ["RUNNER_TEMP"])/"nanopet-author-qa"
          roles={"aether-by-tenkotenmeo":"genshin_traveler_aether",
                 "zhongli-by-vol-tuna":"genshin_zhongli"}
          for source,profile in roles.items():
              folder="SourceNano"+"".join(w.title() for w in source.replace("-by-","-").split("-"))
              role=root/folder
              meta=json.loads((role/"PERSONAL_IMPORT.json").read_text("utf-8"))
              assert meta["selected_profile"]==profile
              assert meta["all_original_frames_preserved"]>=45
              assert not meta["likeness_manually_reviewed"]
              assert validate_native_role(role)["actions"]>=8
              for file in ("stand_0.png","walk_0.png","drag_0.png","fall_0.png"):
                  with Image.open(role/"action"/file) as im: im.verify()
              print("REAL_NANOPET_AUTHOR_FRAMES_OK",source)
          PY
      - name: Download independent Linnea creator sprite atlas; verify native Qt compatible frames
        shell: bash
        run: |
          python tools/install_external_codex.py linnea --role-root "$RUNNER_TEMP/external-art-qa" --accept-personal-use
          python tools/install_external_codex.py sandrone --role-root "$RUNNER_TEMP/external-art-qa" --accept-personal-use
          python tools/install_external_codex.py keqing_chibi --role-root "$RUNNER_TEMP/external-art-qa" --accept-personal-use
          python tools/install_external_codex.py keqing_classic --role-root "$RUNNER_TEMP/external-art-qa" --accept-personal-use
          python tools/install_external_codex.py sayu_cozy --role-root "$RUNNER_TEMP/external-art-qa" --accept-personal-use
          python - <<'PY'
          import json,os
          from pathlib import Path
          from PIL import Image
          from tools.install_native_role import validate_native_role
          root=Path(os.environ["RUNNER_TEMP"])/"external-art-qa"/"SourceExternalLinnea"
          meta=json.loads((root/"PERSONAL_IMPORT.json").read_text("utf-8"))
          assert meta["selected_profile"]=="genshin_linnea",meta
          assert meta["source_pixel_integrity_verified"] is True
          assert not meta["likeness_manually_reviewed"]
          role=validate_native_role(root)
          assert role["images"]>=6 and role["actions"]>=2,role
          for fn in ("pet_conf.json","act_conf.json","IMPORT_REPORT.json"):
              assert (root/fn).is_file(),fn
          for file in list((root/"action").glob("*.png"))[:5]:
              with Image.open(file) as im: im.verify()
          print("REAL_INDEPENDENT_LINNEA_FRAMES_OK",role)
          sandrone=Path(os.environ["RUNNER_TEMP"])/"external-art-qa"/"SourceExternalSandrone"
          info=json.loads((sandrone/"PERSONAL_IMPORT.json").read_text("utf-8"))
          assert info["selected_profile"]=="genshin_sandrone"
          assert info["source_pixel_integrity_verified"] is True
          assert not info["likeness_manually_reviewed"]
          checked=validate_native_role(sandrone)
          assert checked["images"]>=6 and checked["actions"]>=2,checked
          print("REAL_SANDRONE_AUTHOR_FRAMES_OK",checked)
          for kind in ("KeqingChibi", "KeqingClassic"):
