name: Character MOD importer tests

on:
  pull_request:
    paths:
      - "tools/import_codex_pet.py"
      - "docs/chibi_character_pipeline.md"
      - "tools/chibi_layout.py"
      - "tools/chibi_preview.py"
      - "tools/import_chibi_animations.py"
      - "tests/test_import_chibi_animations.py"
      - "tools/chibi_profiles.py"
      - "tests/test_chibi_profiles.py"
      - "tools/__init__.py"
      - "DyberPet/DyberSettings/CharCardUI.py"
      - "docs/codex_character_import.md"
      - "tests/test_import_codex_pet.py"
      - ".github/workflows/character-mod-importer.yml"
  push:
    branches: [main]
    paths:
      - "tools/import_codex_pet.py"
      - "docs/chibi_character_pipeline.md"
      - "tools/chibi_layout.py"
      - "tools/chibi_preview.py"
      - "tools/import_chibi_animations.py"
      - "tests/test_import_chibi_animations.py"
      - "tools/chibi_profiles.py"
      - "tests/test_chibi_profiles.py"
      - "tools/__init__.py"
      - "DyberPet/DyberSettings/CharCardUI.py"
      - "docs/codex_character_import.md"
      - "tests/test_import_codex_pet.py"
      - ".github/workflows/character-mod-importer.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install image dependency
        run: python -m pip install "Pillow>=10,<13"
      - name: Compile modified Python modules
        run: python -m py_compile tools/import_codex_pet.py tools/import_chibi_animations.py tools/chibi_layout.py tools/chibi_profiles.py tools/chibi_preview.py DyberPet/DyberSettings/CharCardUI.py
      - name: Check standalone Windows-friendly CLI
        run: python tools/import_codex_pet.py --help
      - name: Check GIF/PNG importer CLI
        run: python tools/import_chibi_animations.py --help
      - name: Run importer unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
