  package-original-role:
    name: downloadable-original-role
    needs: [test, qt-loader-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install first-party drawing dependency
        run: python -m pip install "Pillow>=10,<13"
      - name: Generate original animated role and verify installed ZIP
        shell: bash
        run: |
          python tools/create_original_mascot.py --output-root out_original
          python - <<'PY'
          from pathlib import Path
          import tempfile
          import zipfile
          from tools.install_native_role import install_native_role, validate_native_role
          role = Path("out_original/StarSprout")
          archive = Path("StarSprout-Original-Role.zip")
          with zipfile.ZipFile(archive, "w", compression=zipfile.ZIP_DEFLATED) as out:
              for item in sorted(role.rglob("*")):
                  if item.is_file():
                      out.write(item, str(Path("StarSprout") / item.relative_to(role)))
          with tempfile.TemporaryDirectory() as tmp:
              reinstalled = install_native_role(archive, Path(tmp) / "installed")
              report = validate_native_role(reinstalled)
              assert report["images"] == 46, report
              assert report["actions"] == 7, report
              assert (reinstalled / "ANIMATION_PREVIEW.png").is_file()
              print("ORIGINAL_ROLE_ZIP_SMOKE_OK", report)
          PY
          sha256sum StarSprout-Original-Role.zip
      - name: Publish original role for zero-code local import
        uses: actions/upload-artifact@v4
        with:
          name: StarSprout-Original-Role
          path: StarSprout-Original-Role.zip
          if-no-files-found: error
          retention-days: 14

  provider-zip-integrity:
    name: Public CodexPetDB r1 ZIP integrity (non-gating candidate)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Prepare PNG atlas verifier
        run: python -m pip install Pillow
      - name: Discover unpinned genuine Genshin role revisions (no art installed)
        continue-on-error: true
        timeout-minutes: 2
        run: python tools/discover_new_codexpetdb_pins.py --limit 25
      - name: Download each SHA-pinned creator ZIP once, then install from verified local cache
        timeout-minutes: 5
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from tools.install_pinned_codexpetdb import (
              get_verified_package, inspect_codex_zip, install_pinned_codexpetdb
          )
          tmp = Path(os.environ["RUNNER_TEMP"])
          root = tmp / "petdb-creator-qa"
          cache = tmp / "petdb-one-download-only"
          cache.mkdir(parents=True, exist_ok=True)
          installed = []
          for key in ("kaveh", "kinich", "kirara", "alhaitham"):
              payload, record = get_verified_package(key)
              local = cache / (record["slug"] + ".zip")
              local.write_bytes(payload)  # Already matched exact SHA-256 and file length.
              bundle = inspect_codex_zip(local)
              assert bundle["manifest"]["id"] == record["slug"]
              role = install_pinned_codexpetdb(
                  key, root, confirmed=True, archive=local)
              installed.append(role)
              receipt = json.loads((role / "PERSONAL_IMPORT.json").read_text("utf-8"))
              report = json.loads((role / "ACTION_PIXEL_AUDIT.json").read_text("utf-8"))
              assert receipt["source_zip_sha256_verified"] == record["sha256"]
              assert (role / "ANIMATION_PREVIEW.png").exists()
              assert not report["summary"]["character_visual_likeness_verified"]
              assert report["summary"]["original_frames_inspected"] > 0
              print("VERIFIED_SOURCE_AND_NATIVE_IMPORT", key, len(payload), report["summary"])
          assert len(installed) == 4
          assert {json.loads((r / "PERSONAL_IMPORT.json").read_text("utf-8"))[
              "selected_profile"] for r in installed} == {
              "genshin_kaveh", "genshin_kinich",
              "genshin_kirara", "genshin_alhaitham"
          }
          PY

