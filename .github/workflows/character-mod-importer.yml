name: Character MOD importer tests

on:
  pull_request:
    paths:
      - "tools/import_codex_pet.py"
      - "tests/test_import_codex_pet.py"
      - ".github/workflows/character-mod-importer.yml"
  push:
    branches: [main]
    paths:
      - "tools/import_codex_pet.py"
      - "tests/test_import_codex_pet.py"
      - ".github/workflows/character-mod-importer.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install image dependency
        run: python -m pip install "Pillow>=10,<13"
      - name: Run importer unit tests
        run: python -m unittest discover -s tests -p "test_import_codex_pet.py" -v
