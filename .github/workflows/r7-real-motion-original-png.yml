name: R7 original art full-frame movement audit
on:
  push:
    branches: [feat/r7-real-frame-motion-audit-20261026]
  pull_request:
    paths:
      - tools/creator_motion_quality.py
      - DyberPet/DyberSettings/native_frame_preview.py
      - tests/test_creator_motion_quality.py
      - .github/workflows/r7-real-motion-original-png.yml
permissions:
  contents: read
concurrency:
  group: dyberpet-r7-full-original-pose-${{ github.ref }}
  cancel-in-progress: true
jobs:
  all-original-frames:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Linux Qt libraries
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 libx11-xcb1
      - run: python -m pip install "Pillow>=11,<13" "PySide6>=6.7,<7"
      - run: python -m unittest discover -s tests -p "test_creator_motion_quality.py" -v
      - run: python -m unittest discover -s tests -p "test_native_interaction_preview_shortcuts.py" -v
      - run: python -m unittest discover -s tests -p "test_creator_variant_side_by_side_qt.py" -v
      - run: python -m unittest discover -s tests -p "test_creator_chibi_quality.py" -v
      - run: python -m compileall -q tools/creator_motion_quality.py DyberPet/DyberSettings/native_frame_preview.py
      - run: python -c "from pathlib import Path; assert not list(Path('res/role').glob('Source*')); print('THIRD_PARTY_ART_NOT_COMMITTED=true')"
