name: Desktop pet assistant

on:
  pull_request:
    paths:
      - "DyberPet/assistant/**"
      - "tools/verify_real_creator_runtime.py"
      - "tools/audit_guga.py"
      - "tools/audit_character.py"
      - "docs/character_fidelity.md"
      - "docs/guga_authenticity.md"
      - "DyberPet/DyberPet.py"
      - "DyberPet/DyberSettings/GameSaveUI.py"
      - "DyberPet/Accessory.py"
      - "DyberPet/modules.py"
      - "DyberPet/conf.py"
      - "tests/test_assistant_*.py"
      - "tests/test_role_interactions.py"
      - "tests/test_creator_assistant_integration*.py"
      - "tools/creator_assistant_gap_report.py"
      - "DyberPet/DyberSettings/native_frame_preview.py"
      - "tools/creator_art_manual_review.py"
      - "DyberPet/DyberSettings/character_catalog_dialog.py"
      - "DyberPet/DyberSettings/CharCardUI.py"
      - "tools/character_interaction_coverage.py"
      - "tests/test_save_snapshot.py"
      - "tests/test_offline_restore.py"
      - "docs/pet_assistant.md"
      - ".github/workflows/pet-assistant.yml"
  push:
    branches:
      - "feat/pet-actions-voice-persona-20261023"
    paths:
      - "DyberPet/assistant/**"
      - "DyberPet/DyberPet.py"
      - "DyberPet/DyberSettings/GameSaveUI.py"
      - "DyberPet/Accessory.py"
      - "DyberPet/modules.py"
      - "DyberPet/conf.py"
      - "tests/test_assistant_*.py"
      - "tests/test_role_interactions.py"
      - "tests/test_creator_assistant_integration*.py"
      - "tools/creator_assistant_gap_report.py"
      - "DyberPet/DyberSettings/native_frame_preview.py"
      - "tools/creator_art_manual_review.py"
      - "DyberPet/DyberSettings/character_catalog_dialog.py"
      - "DyberPet/DyberSettings/CharCardUI.py"
      - "tools/character_interaction_coverage.py"
      - "tests/test_save_snapshot.py"
      - "tests/test_offline_restore.py"
      - ".github/workflows/pet-assistant.yml"

permissions:
  contents: read

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.11"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile assistant and main entry
        run: python -m compileall -q DyberPet/assistant DyberPet/DyberPet.py DyberPet/Accessory.py DyberPet/modules.py DyberPet/conf.py tools/character_interaction_coverage.py
      - name: Check Guga local fidelity CLI
        run: python tools/audit_guga.py --help
      - name: Check all-character fidelity CLI
        run: python tools/audit_character.py --help
      - name: Install character converter image dependency
        run: python -m pip install "Pillow==11.3.0"
      - name: Check direct CLI role-gap reporter
        run: python tools/creator_assistant_gap_report.py --help
      - name: Test workspace, PPL and voice guards
        run: |
          python -m unittest discover -s tests -p "test_assistant_*.py" -v
          python -m unittest discover -s tests -p "test_role_interactions.py" -v
          python -m unittest discover -s tests -p "test_creator_assistant_integration.py" -v
      - name: Verify full backup and tamper safeguards
        run: python -m unittest discover -s tests -p "test_save_snapshot.py" -v
      - name: Verify offline data restore rollback, tamper and interruption
        run: python -m unittest discover -s tests -p "test_offline_restore.py" -v

  qt-gui-smoke:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PySide6 and original sprite decoder
        run: python -m pip install "PySide6==6.5.2" "Pillow==11.3.0"
      - name: Test actual assistant UI offscreen
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m unittest discover -s tests -p "test_assistant_qt.py" -v
          python -m unittest discover -s tests -p "test_creator_assistant_integration_qt.py" -v

  ppl-real-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Checkout PPL reference product
        uses: actions/checkout@v4
        with:
          repository: clonetimer/PPL
          # Qualified against PPL main at 2026-10-23; keep cross-repo smoke deterministic.
          ref: a587e5b6ffb62fd005ac67e98eed79fac3dd66de
          path: ppl-src
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install PPL product workspace
        working-directory: ppl-src
        run: npm ci --ignore-scripts
      - name: Run live Character Governance HTTP contract
        env:
          PPL_INTEGRATION_HOME: ${{ github.workspace }}/ppl-src
        run: python -m unittest discover -s tests -p "test_assistant_ppl_live.py" -v

  creator-zip-runtime-integration:
    name: Real artist ZIP to PetWidget groups (non-gating network smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install real sprites decoder
        run: python -m pip install "Pillow==11.3.0"
      - name: Independently verify publisher SHA, original pixels, and actual PetWidget group mapping
        timeout-minutes: 8
        run: python tools/verify_real_creator_runtime.py
    # All publisher pixels stay in temporary local CI only; no art is uploaded or bundled.
